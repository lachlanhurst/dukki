# Dukki's own settings: the walk policy gearplay 10000, sit-stand 9248 and stand-up (getting up after
# a fall) 9250, with the settings that stood and walked best (docs/policy-testing.md). Calibration
# tables from hardware/calibration/.
#
# Installed as robotd's user layer, /var/lib/robot/robotd.toml, over the microduck dukki template
# at /etc/robot/robotd.toml (deploy/robotd.toml, never edited by hand): robotd reads the two
# merged, this file winning key by key. Needs microduck dukki with the upstream 0.23.0 merge or
# later; older builds read /etc/robot/robotd.toml alone (docs/compute-setup.md).
# Needs microduck dukki aa0bf3a8 or later (bridge protocol 3, the gyro at +-2000 dps; also
# bridge_imu_median, sitstand_rise_s), and the bridge firmware to match. The mouth settings
# (bridge_mouth_kp, mouth_alpha) need microduck dukki 1d8b1bb4 or later.
#
# Stiffness: the policy gain (200) times bridge_kp_per_gain is the J288 kp, N.m/rad. 0.005 gives
# kp 1.0, what the Dukki policies were trained at (microduck_rl runs *-kp1-kd0p05).
# kd 0.07, above the 0.05 they trained at: the robot stood still and walked calmly with it, where at
# 0.05 it kept making small corrections; one of two pushed stands fell twice.
# No IMU median: it held the gyro and gravity back about 20 ms, past the 0 to 20 ms of IMU delay
# training randomises; without it the walk test finished for the first time.
[bus]
bridge_kp_per_gain = 0.005
bridge_imu_median = false
bridge_kd = 0.07
# The mouth's kp on its own, N.m/rad: at the legs' 1.0 the jaw's friction held the beak about 3
# degrees short of closed. 4.0 closes it fully (23/11/2026).
bridge_mouth_kp = 4.0

# Easing on the mouth opening from the pad's triggers: at kp 4.0 it snapped open and shut. 0.2 at
# 50 Hz is a time constant of about 0.1 s; 0.1 felt slow.
[control]
mouth_alpha = 0.2

# Only Dukki's own walk policy: every other slot defaults to Pollen's alpha networks, which must
# not run on this robot. Settings match the training env (microduck_rl Mjlab-Velocity-Flat-Dukki):
# action scale 1.0, and no battery-voltage scaling (the J288 loop does not depend on supply).
[policy]
# Gearplay 10000 (microduck_rl run *_dukki-walk-gearplay-kp1-kdr): trained with gear play, joint friction
# up to 4 times the bench fit and kd 0.05 to 0.08. Walks straight and backwards where 9250
# (dukki_walk_friction_9250.onnx, still installed) circled on the polyurethane soles and fell backwards.
walk = "/opt/robot/policies/dukki/dukki_walk_gearplay_10000.onnx"
# Stand-up 9250 (run 2026-11-23_16-32-59_dukki-standup-nobc-kp1-kdr): gets up from face down, face up and
# its side in 0.3 to 0.7 s (docs/policy-testing.md section 11). This slot runs whenever the speed command
# is near zero, so it also does the standing still; limp_fall hands a fallen robot to it.
stand = "/opt/robot/policies/dukki/dukki_standup_nobc_9250.onnx"
# The stand slot at the gain it was trained at: robotd's default 0.8 softens it, and sit-stand at zero
# command with it.
standing_gain_ratio = 1.0
# Dukki's sit-stand 9248 (run *_dukki-sitstand-gearplay-kp1-kdr): 7749 fine-tuned with gear play, joint
# friction up to 4 times and kd 0.05 to 0.08. Cross on the pad sits and stands. 7749
# (dukki_sitstand_stops_7749.onnx, still installed) sat well but fell over backwards every time it rose.
# The walk policy takes over 1.5 s into the rise (robotd's default of 1.0 s is for Pollen's quicker one;
# needs microduck dukki da3e241a or later).
sitstand = "/opt/robot/policies/dukki/dukki_sitstand_gearplay_9248.onnx"
sitstand_rise_s = 1.5
ground_pick = "none"
kick_left = "none"
kick_right = "none"
roulade = "none"
action_scale = 1.0
# robotd's target low-pass, robot side only (Pollen trains unfiltered and filters on the robot; the
# Dukki policies train unfiltered too, microduck_rl 827a9112). Legs 0.85 let the robot fall into a
# self-sustaining jitter standing, and head 0.6 did not help; legs 0.5 and below lost walks to
# friction in sim.
head_lowpass = 0.5
legs_lowpass = 0.7
voltage_adapt = false

# The idle look-around (upstream 0.17), on. It moves the head command the policy reads, and while
# the robot stands still that is the stand-up policy's. Dukki's policies train head commands to 0.9
# of each joint's reach from HOME inside the firmware clip: head roll +-0.236 rad, neck pitch about
# 0.18 rad on the positive side. Upstream's tilt_roll 0.3 and glance_neck 0.15, plus 0.04 drift,
# go past both. Everything else is upstream's.
[idle]
tilt_roll = 0.18
glance_neck = 0.12

# Limp-fall on (the default): past about 26 degrees of tilt with a fall predicted, kp drops to 0.25 so a
# robot getting away from its policy goes soft while it is caught. Training kept control to 70 degrees, so it
# can cut a recovery short; that is the price of a safer bench.
[safety]
limp_fall = true

# Joint zeros: each J288's output encoder count with its joint at the model's zero. Averaged
# over four seatings in the calibration jig, 21/11/2026, by scripts/joint_scope/seatings.py (the
# seatings spread 0.8 to 5.1 degrees, so the average is good to about 1 degree on most joints).
# The mouth's from its closed stop, which reads -8 degrees. For robotd.toml.
[bus.bridge_zero]
left_hip_yaw = 7590
left_hip_roll = 1128
left_hip_pitch = 7553
left_knee = 1709
left_ankle = 574
neck_pitch = 3028
head_pitch = 6100
head_yaw = 4812
head_roll = 7137
mouth = 5707
right_hip_yaw = 7873
right_hip_roll = 7382
right_hip_pitch = 1704
right_knee = 4924
right_ankle = 1444
# The trunk IMU's mount, chip frame to trunk frame, unit quaternion: from four seatings in the
# calibration jig (down along the trunk's -x) and the jig held head up by hand (down along -z),
# 21/11/2026, by scripts/joint_scope/seatings.py. 3.4 degrees from the CAD's (0.5, -0.5, -0.5,
# 0.5); roll about the trunk's x is only as good as the hand-held vertical, about 1 to 2 degrees.
# For robotd.toml.
[bus.bridge_imu_mount]
w = 0.48797
x = -0.52513
y = -0.49241
z = 0.49362

# What full stick deflection asks for while walking (padd), inside the range the walk policy trained on
# (vx and vy +-0.4 / +-0.3, yaw +-1.0). Turning on the spot does nothing below about 0.7 rad/s, so the
# right stick's first 70% is dead standing still; walking, it turns through the whole range.
[pad_drive]
vx_max = 0.3
vx_min = -0.2
vy_max = 0.2
vy_min = -0.2
vyaw_max = 1.0
vyaw_min = -1.0
