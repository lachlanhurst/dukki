# ALSA defaults for the microduck head audio: the MAX98357A amplifier and INMP441 microphone on
# SAI2, card "microduck" (overlay microduck-nano-a-sai2). Installed to /etc/asound.conf by
# scripts/compute/setup-audio.sh.
#
# The card has no mixer of its own, so playback goes through a softvol control, "Speaker",
# which appears in amixer after the first playback. dmix and dsnoop hold the hardware at a fixed
# 48 kHz, stereo, S32_LE (the design point for both parts) and let several players or recorders
# share it. plug in front of both paths converts rate, width and channels, so 16 kHz mono S16
# capture and any playback format both work. ipc_perm 0666 lets services under other users
# share the same dmix and dsnoop instances.

pcm.!default {
	type asym
	playback.pcm "speaker"
	capture.pcm "mic"
}

ctl.!default {
	type hw
	card microduck
}

pcm.speaker {
	type plug
	slave.pcm "speaker_softvol"
}

pcm.speaker_softvol {
	type softvol
	slave.pcm "speaker_dmix"
	control {
		name "Speaker"
		card microduck
	}
	min_dB -51.0
	max_dB 0.0
}

pcm.speaker_dmix {
	type dmix
	ipc_key 5978
	ipc_perm 0666
	slave {
		pcm "hw:microduck,0"
		format S32_LE
		rate 48000
		channels 2
		period_size 1024
		buffer_size 4096
	}
}

pcm.mic {
	type plug
	slave.pcm "mic_dsnoop"
}

pcm.mic_dsnoop {
	type dsnoop
	ipc_key 5979
	ipc_perm 0666
	slave {
		pcm "hw:microduck,0"
		format S32_LE
		rate 48000
		channels 2
		period_size 1024
		buffer_size 4096
	}
}
